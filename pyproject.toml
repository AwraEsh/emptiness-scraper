[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "emptiness-scraper"
version = "1.0.0"
description = "Offline metrics and rule-based analysis for Telegram one-to-one JSON exports"
requires-python = ">=3.11"
authors = [{name = "AwraEsh"}]
dependencies = [
    "rich>=13.9,<16",
    "regex>=2024.11",
    "jdatetime>=5.2,<7",
    "tzdata>=2025.1",
    "platformdirs>=4.3,<5",
]

[project.scripts]
emptiness-scraper = "emptiness_scraper.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["emptiness_scraper*"]

