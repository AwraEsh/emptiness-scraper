[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "emptiness-scraper"
version = "1.1.2"
description = "Offline metrics and rule-based analysis for Telegram one-to-one JSON exports"
requires-python = ">=3.11"
authors = [{name = "AwraEsh"}]
dependencies = [
    "rich>=14.2,<16",
    "textual>=6.12,<7",
    "regex>=2024.11",
    "jdatetime>=5.2,<7",
    "tzdata>=2025.1",
    "platformdirs>=4.3,<5",
    "arabic-reshaper>=3,<4",
    "python-bidi>=0.6,<0.7",
]

[project.scripts]
emptiness-scraper = "emptiness_scraper.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["emptiness_scraper*"]

[tool.setuptools.package-data]
emptiness_scraper = ["*.tcss"]

